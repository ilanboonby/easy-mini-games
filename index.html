<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLS Quest</title>
<style>
:root {
  --bg: #f5f6fa; --card: #ffffff; --ink: #1c2230; --muted: #5d667a; --line: #dde1ea;
  --accent: #3b5bdb; --accent-ink: #ffffff; --ok: #1f8a4c; --ok-bg: #e3f6ea;
  --bad: #c92a2a; --bad-bg: #fde8e8; --warn-bg: #fff4d6; --code: #eef0f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --card: #1b2030; --ink: #e8ebf3; --muted: #9aa3b8; --line: #2d3550;
    --accent: #7c93ff; --accent-ink: #0d1020; --ok: #5fd08a; --ok-bg: #16301f;
    --bad: #ff7b7b; --bad-bg: #3a1a1a; --warn-bg: #3a3112; --code: #232a3f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.5rem; margin: 8px 0 0; }
h2 { font-size: 1.25rem; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 16px; }
nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
nav button { flex: 1 1 130px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: .9rem; }
nav button[disabled] { opacity: .45; cursor: not-allowed; }
nav button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
nav .stars { display: block; font-size: .8rem; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.story { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; }
button.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button.btn[disabled] { opacity: .5; cursor: not-allowed; }
.opts { display: grid; gap: 8px; margin: 12px 0; }
.opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.good { background: var(--ok-bg); border-color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
.fb.ok { background: var(--ok-bg); } .fb.ko { background: var(--bad-bg); }
code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.actor { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.actor h3 { margin: 0 0 6px; font-size: 1rem; }
.eve { border-color: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .95rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; word-break: break-word; }
input[type=range] { width: 100%; }
input[type=number] { width: 90px; padding: 6px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.order li { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--card); }
.order li.good { background: var(--ok-bg); border-color: var(--ok); }
.order li.bad { background: var(--bad-bg); border-color: var(--bad); }
.order { list-style: none; padding: 0; margin: 12px 0; }
.order .lbl { flex: 1; } .order small { display: block; color: var(--muted); }
.order button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; }
.log { background: var(--code); border-radius: 8px; padding: 10px 12px; font-size: .92rem; min-height: 60px; }
.log p { margin: 4px 0; }
.sw { display: flex; align-items: center; gap: 8px; }
.tag { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: .8rem; font-weight: 600; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.ko { background: var(--bad-bg); color: var(--bad); }
.cert { font-size: .95rem; }
.fiche li { margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>🔐 TLS Quest</h1>
  <p class="sub">Comprendre pourquoi (et comment) le petit cadenas du navigateur te protège — en jouant.</p>
  <nav id="nav" aria-label="Niveaux"></nav>
  <div id="stage"></div>
  <p class="sub" style="text-align:center"><button class="btn ghost" id="reset">Réinitialiser la progression</button></p>
</main>

<script>
"use strict";

/* ---------- petits utilitaires ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function modpow(b, e, m) {
  b = BigInt(b) % BigInt(m); e = BigInt(e); m = BigInt(m);
  let r = 1n;
  while (e > 0n) { if (e & 1n) r = (r * b) % m; b = (b * b) % m; e >>= 1n; }
  return r;
}
const store = {
  load() { try { return JSON.parse(localStorage.getItem("tlsquest") || "null"); } catch (e) { return null; } },
  save(s) { try { localStorage.setItem("tlsquest", JSON.stringify(s)); } catch (e) { /* stockage indisponible : on joue sans */ } },
  clear() { try { localStorage.removeItem("tlsquest"); } catch (e) { /* idem */ } }
};

/* ---------- moteur de quiz réutilisable ---------- */
// questions: [{q, opts:[...], good:index, why}] ; onDone(erreurs)
function quiz(box, questions, onDone) {
  let i = 0, errors = 0;
  function show() {
    box.replaceChildren();
    const q = questions[i];
    const fb = h("div");
    const next = h("button", { class: "btn", hidden: true, onclick: () => { i++; i < questions.length ? show() : onDone(errors); } },
      i + 1 < questions.length ? "Question suivante →" : "Terminer");
    const order = shuffle(q.opts.map((t, idx) => ({ t, idx })));
    const btns = order.map(({ t, idx }) => {
      const b = h("button", { class: "opt", onclick: () => {
        if (idx === q.good) {
          b.classList.add("good");
          btns.forEach(x => x.disabled = true);
          fb.replaceChildren(h("div", { class: "fb ok", html: "✅ " + q.why }));
          next.hidden = false;
        } else {
          errors++; b.classList.add("bad"); b.disabled = true;
          fb.replaceChildren(h("div", { class: "fb ko", html: "❌ " + (q.hints && q.hints[idx] ? q.hints[idx] : "Pas tout à fait, réessaie.") }));
        }
      } });
      b.innerHTML = t;
      return b;
    });
    box.append(h("p", { class: "sub" }, `Question ${i + 1} / ${questions.length}`), h("p", { html: q.q }), h("div", { class: "opts" }, btns), fb, next);
  }
  show();
}

/* ---------- niveaux ---------- */
const LEVELS = [];

/* Niveau 1 — clés publique / privée */
LEVELS.push({
  title: "Le cadenas et la clé",
  intro: `<div class="story">📖 <b>Alice</b> veut envoyer un message à <b>Bob</b> à travers un réseau où <b>Mallory</b> peut tout lire. Ils ne se sont jamais rencontrés : impossible de partager un secret à l'avance. Solution : la <b>cryptographie asymétrique</b>. Chacun a une <b>paire de clés</b> : une <b>publique</b> (que tout le monde peut avoir, comme un cadenas ouvert) et une <b>privée</b> (qu'il ne montre jamais).<br><br>Règle d'or : <b>ce que l'une chiffre, seule l'autre peut le déchiffrer.</b></div>`,
  render(box, done) {
    quiz(box, [
      { q: "Alice veut envoyer un message <b>confidentiel</b> à Bob. Avec quelle clé le chiffre-t-elle ?",
        opts: ["La clé <b>publique</b> de Bob", "La clé <b>privée</b> de Bob", "La clé <b>privée</b> d'Alice", "La clé <b>publique</b> d'Alice"], good: 0,
        hints: { 1: "Alice n'a (heureusement) jamais accès à la clé privée de Bob.", 2: "Chiffrer avec sa propre clé privée, c'est une <i>signature</i> : tout le monde pourrait le lire.", 3: "Seule Alice pourrait alors le déchiffrer… pas Bob." },
        why: "Le message est chiffré avec le cadenas ouvert de Bob. Seul Bob, qui détient la clé privée, peut l'ouvrir." },
      { q: "Mallory intercepte le message chiffré et connaît la clé publique de Bob (elle est publique !). Peut-elle le lire ?",
        opts: ["Non : il faut la clé <b>privée</b> de Bob", "Oui, la clé publique suffit", "Oui, en la combinant avec celle d'Alice"], good: 0,
        hints: { 1: "Si la clé publique suffisait à déchiffrer, elle ne servirait à rien.", 2: "La clé d'Alice n'intervient pas dans ce sens." },
        why: "La clé publique ne permet que de <i>chiffrer</i>. Retrouver la clé privée à partir d'elle est mathématiquement infaisable (factorisation, logarithme discret…)." },
      { q: "Bob veut prouver que c'est bien <b>lui</b> qui a écrit un message : il le <b>signe</b>. Avec quelle clé ?",
        opts: ["Sa clé <b>privée</b>", "Sa clé <b>publique</b>", "La clé publique d'Alice"], good: 0,
        hints: { 1: "Tout le monde a sa clé publique : n'importe qui pourrait « signer » comme lui.", 2: "Ça ne prouverait rien sur l'auteur." },
        why: "Seul Bob possède sa clé privée : seul lui peut produire une signature valide." },
      { q: "Qui peut <b>vérifier</b> la signature de Bob ?",
        opts: ["Tout le monde, avec la clé <b>publique</b> de Bob", "Uniquement Alice", "Uniquement Bob lui-même"], good: 0,
        hints: { 1: "La vérification n'est pas réservée à un destinataire.", 2: "Ce serait inutile : lui sait déjà qu'il a signé." },
        why: "La vérification est publique : c'est tout l'intérêt. Retiens : <b>chiffrer = clé publique du destinataire ; signer = clé privée de l'expéditeur.</b>" },
      { q: "Petit piège : pourquoi TLS n'utilise-t-il pas la cryptographie asymétrique pour chiffrer <i>toute</i> la conversation ?",
        opts: ["Elle est beaucoup plus lente que la symétrique", "Elle est moins sûre", "Elle ne marche que sur du texte"], good: 0,
        hints: { 1: "Elle est sûre, mais coûteuse.", 2: "Ça marche sur n'importe quelles données." },
        why: "On l'utilise juste pour <b>s'entendre sur une clé de session symétrique</b> (rapide, ex. AES), puis tout le reste passe en symétrique." }
    ], done);
  }
});

/* Niveau 2 — Diffie-Hellman */
LEVELS.push({
  title: "Se mettre d'accord en public",
  intro: `<div class="story">📖 Comment Alice et Bob peuvent-ils fabriquer <b>le même secret</b> alors qu'Ève écoute <i>tout</i> ce qu'ils s'envoient ? C'est l'échange de clés <b>Diffie-Hellman</b> (TLS 1.3 utilise sa variante sur courbes elliptiques). Chacun garde un nombre secret, envoie une version « mélangée », puis refait un mélange avec ce qu'il reçoit : ils tombent sur le même résultat.<br>Les nombres publics : <code>p = 23</code> et <code>g = 5</code>.</div>`,
  render(box, done) {
    const P = 23, G = 5;
    let a = 6, b = 15, step = 0, phase = 1, errors = 0;
    const view = h("div");
    box.append(view);
    const val = (x, y) => modpow(x, y, P).toString();
    function draw() {
      view.replaceChildren();
      if (phase === 1) {
        const A = val(G, a), B = val(G, b), sA = val(B, a), sB = val(A, b);
        const sliderA = h("input", { type: "range", min: 2, max: 21, value: a, oninput: e => { a = +e.target.value; step = 0; draw(); } });
        const sliderB = h("input", { type: "range", min: 2, max: 21, value: b, oninput: e => { b = +e.target.value; step = 0; draw(); } });
        const row = (label, text, ok) => h("p", { class: ok ? "" : "sub" }, ok ? h("span", { html: text }) : `${label}…`);
        view.append(
          h("h2", {}, "Phase 1 · Joue Alice et Bob"),
          h("p", { class: "sub" }, "Choisis les secrets (curseurs), puis fais avancer l'échange étape par étape."),
          h("div", { class: "grid2" },
            h("div", { class: "actor" }, h("h3", {}, "👩 Alice"), h("div", { class: "sw" }, "secret a = ", h("b", {}, a)), sliderA,
              row("1", `Envoie <code>A = g^a mod p = ${A}</code>`, step >= 1),
              row("3", `Calcule <code>B^a mod p = ${B}^${a} mod 23 = ${sA}</code>`, step >= 2)),
            h("div", { class: "actor" }, h("h3", {}, "👨 Bob"), h("div", { class: "sw" }, "secret b = ", h("b", {}, b)), sliderB,
              row("2", `Envoie <code>B = g^b mod p = ${B}</code>`, step >= 1),
              row("4", `Calcule <code>A^b mod p = ${A}^${b} mod 23 = ${sB}</code>`, step >= 2))),
          h("div", { class: "actor eve", style: "margin-top:12px" }, h("h3", {}, "🕵️ Ève (écoute le réseau)"),
            h("p", { html: step >= 1 ? `Elle voit : <code>p=23</code>, <code>g=5</code>, <code>A=${A}</code>, <code>B=${B}</code>. Mais ni <b>a</b> ni <b>b</b>.` : "Elle ne voit encore que <code>p=23</code> et <code>g=5</code>." })),
          step >= 2 ? h("div", { class: "fb ok", html: `✅ Secret partagé : <b>${sA}</b> des deux côtés (${sA === sB ? "identique" : "?"}). Essaie d'autres curseurs : ça marche toujours, car <code>(g^a)^b = (g^b)^a</code>.` }) : null,
          h("p", {}, step < 2
            ? h("button", { class: "btn", onclick: () => { step++; draw(); } }, step === 0 ? "Alice et Bob s'envoient leurs valeurs" : "Chacun calcule le secret")
            : h("button", { class: "btn", onclick: () => { phase = 2; draw(); } }, "Phase 2 : jouer Ève →")));
      } else if (phase === 2) {
        const sa = 13, sb = 9, A = val(G, sa);
        let found = null;
        const input = h("input", { type: "number", min: 1, max: 22, value: 1 });
        const out = h("div");
        view.append(
          h("h2", {}, "Phase 2 · Joue Ève"),
          h("p", { html: `Tu as intercepté <code>A = ${A}</code> (avec <code>g=5</code>, <code>p=23</code>). Trouve l'exposant secret <b>a</b> tel que <code>5^a mod 23 = ${A}</code>.` }),
          h("div", { class: "row" }, "a =", input, h("button", { class: "btn", onclick: () => {
            const g = +input.value;
            if (val(G, g) === A) {
              found = g;
              out.replaceChildren(h("div", { class: "fb ok", html: `✅ Trouvé : a = ${g}. Avec p = 23 il n'y a que 22 possibilités : un ordinateur (ou toi, en cherchant un peu) casse ça instantanément.` }),
                h("p", {}, h("button", { class: "btn", onclick: () => { phase = 3; draw(); } }, "Et en vrai ? →")));
            } else {
              errors++;
              out.replaceChildren(h("div", { class: "fb ko", html: `❌ 5^${g} mod 23 = ${val(G, g)}, pas ${A}. Essaie une autre valeur.` }));
            }
          } }, "Tester")),
          out);
      } else {
        view.append(h("h2", {}, "Phase 3 · Passer à l'échelle"));
        const qbox = h("div");
        view.append(qbox);
        quiz(qbox, [
          { q: "En vrai, <code>p</code> fait plus de 2000 bits (ou on utilise des courbes elliptiques). Pourquoi Ève ne peut-elle plus « tester tous les a » ?",
            opts: ["Il y a un nombre astronomique de possibilités (retrouver <i>a</i> = problème du <b>logarithme discret</b>)", "Parce que p est secret", "Parce que le réseau est chiffré"], good: 0,
            hints: { 1: "p est public, comme g.", 2: "Justement : le réseau n'est pas encore chiffré à ce stade, c'est ce qu'on met en place." },
            why: "Calculer g^a mod p est facile ; retrouver a à partir du résultat est infaisable pour de grands p. C'est cette asymétrie de difficulté qui fait tout." },
          { q: "Bonus : TLS 1.3 utilise des clés <b>éphémères</b> (ECDHE) : de nouveaux secrets à chaque connexion. Quel avantage ?",
            opts: ["<b>Confidentialité persistante</b> : voler la clé du serveur plus tard ne permet pas de déchiffrer les anciennes conversations enregistrées", "La connexion est plus rapide", "On n'a plus besoin de certificat"], good: 0,
            hints: { 1: "Ce n'est pas le but principal.", 2: "Faux : on verra au niveau 5 que sans certificat, un attaquant peut s'interposer." },
            why: "Les secrets a et b sont jetés après la session : il n'y a plus rien à voler. C'est le <i>forward secrecy</i>." }
        ], e => done(errors + e));
      }
    }
    draw();
  }
});

/* Niveau 3 — certificats */
LEVELS.push({
  title: "Faire confiance (ou pas)",
  intro: `<div class="story">📖 Diffie-Hellman donne un secret, mais <b>avec qui</b> ? Quand tu vas sur <code>banque.fr</code>, le serveur envoie un <b>certificat</b> : sa clé publique + son identité, <b>signés par une autorité de certification (CA)</b> que ton navigateur connaît déjà. Ton navigateur vérifie 4 choses : <b>le nom</b> correspond au site, <b>la date</b> est valide, la <b>signature</b> remonte (via des intermédiaires) jusqu'à une <b>CA racine de confiance</b>, et le certificat n'est pas révoqué.<br>Tu es le navigateur. Date du jeu : <b>5 octobre 2026</b>. Pour chaque certificat : <b>accepter</b> ou <b>rejeter</b> ?</div>`,
  render(box, done) {
    const CASES = [
      { site: "banque.fr", cn: "banque.fr", issuer: "R11 (intermédiaire) ← ISRG Root X1 (racine de confiance)", from: "1 sept. 2026", to: "1 déc. 2026", ok: true,
        why: "Nom correct, date valide, chaîne complète jusqu'à une racine présente dans ton navigateur : on fait confiance." },
      { site: "banque.fr", cn: "banque-fr.connexion-securisee.xyz", issuer: "R11 (intermédiaire) ← ISRG Root X1 (racine de confiance)", from: "1 sept. 2026", to: "1 déc. 2026", ok: false,
        why: "Le certificat est valide… mais pour <b>un autre domaine</b>. Un attaquant peut obtenir un vrai certificat pour son propre site : le <b>nom</b> doit correspondre à celui demandé." },
      { site: "boutique.fr", cn: "boutique.fr", issuer: "R11 (intermédiaire) ← ISRG Root X1 (racine de confiance)", from: "1 janv. 2025", to: "1 avr. 2025", ok: false,
        why: "Certificat <b>expiré</b>. Les dates limitent la durée d'exposition d'une clé volée." },
      { site: "intranet.exemple.fr", cn: "intranet.exemple.fr", issuer: "intranet.exemple.fr (auto-signé)", from: "1 janv. 2026", to: "1 janv. 2036", ok: false,
        why: "Un certificat <b>auto-signé</b> ne prouve rien : n'importe qui peut en fabriquer un. Aucune CA de confiance n'a vérifié l'identité." },
      { site: "mairie.fr", cn: "mairie.fr", issuer: "Sub-CA Régionale ← Autorité Nationale (racine de confiance)", from: "10 août 2026", to: "10 nov. 2026", ok: true,
        why: "La chaîne a un intermédiaire de plus, mais elle remonte bien à une racine de confiance : <b>chaque maillon signe le suivant</b>." },
      { site: "promo.fr", cn: "promo.fr", issuer: "MegaCertif Discount Inc. (inconnue de ton navigateur)", from: "1 sept. 2026", to: "1 sept. 2027", ok: false,
        why: "Le certificat est cohérent, mais l'émetteur n'est <b>pas dans les racines de confiance</b>. Ton navigateur ne peut pas vérifier la chaîne." }
    ];
    const order = shuffle(CASES);
    let i = 0, errors = 0;
    function show() {
      box.replaceChildren();
      const c = order[i];
      const fb = h("div");
      const next = h("button", { class: "btn", hidden: true, onclick: () => { i++; i < order.length ? show() : done(errors); } }, i + 1 < order.length ? "Certificat suivant →" : "Terminer");
      const answer = verdict => {
        const good = verdict === c.ok;
        if (!good) errors++;
        fb.replaceChildren(h("div", { class: "fb " + (good ? "ok" : "ko"), html: (good ? "✅ " : "❌ ") + (c.ok ? "<b>À accepter.</b> " : "<b>À rejeter.</b> ") + c.why }));
        btns.forEach(b => b.disabled = true);
        next.hidden = false;
      };
      const btns = [h("button", { class: "btn", onclick: () => answer(true) }, "✅ Faire confiance"), h("button", { class: "btn ghost", onclick: () => answer(false) }, "⛔ Rejeter")];
      box.append(h("p", { class: "sub" }, `Certificat ${i + 1} / ${order.length}`),
        h("p", { html: `Tu navigues vers <code>${c.site}</code>. Le serveur présente :` }),
        h("div", { class: "actor cert" }, h("dl", { class: "kv" },
          h("dt", {}, "Délivré à"), h("dd", {}, c.cn), h("dt", {}, "Émetteur (chaîne)"), h("dd", {}, c.issuer),
          h("dt", {}, "Valide du"), h("dd", {}, c.from), h("dt", {}, "au"), h("dd", {}, c.to))),
        h("div", { class: "row", style: "margin-top:12px" }, btns), fb, next);
    }
    show();
  }
});

/* Niveau 4 — ordre du handshake */
LEVELS.push({
  title: "La poignée de main",
  intro: `<div class="story">📖 Place les messages du <b>handshake TLS 1.3</b> (version simplifiée) dans le bon ordre, du premier au dernier. Utilise ▲ ▼ puis valide.</div>`,
  render(box, done) {
    const STEPS = [
      { t: "ClientHello", d: "Client → Serveur : versions TLS, suites de chiffrement acceptées, et sa <b>moitié d'échange de clés</b> (Diffie-Hellman éphémère)." },
      { t: "ServerHello", d: "Serveur → Client : suite choisie + <b>sa moitié</b> de l'échange de clés. À partir de là, les deux calculent le secret et chiffrent la suite." },
      { t: "Certificate + CertificateVerify", d: "Serveur → Client : son certificat, et une <b>signature</b> prouvant qu'il possède la clé privée correspondante (anti-usurpation)." },
      { t: "Finished (serveur)", d: "Serveur → Client : « voici un condensé de tout ce qu'on s'est dit » : détecte toute modification du handshake." },
      { t: "Finished (client)", d: "Client → Serveur : même vérification de son côté, après avoir validé le certificat." },
      { t: "Données applicatives chiffrées", d: "Le trafic HTTP circule, chiffré en <b>symétrique</b> avec les clés de session dérivées." }
    ];
    let list = shuffle(STEPS.map((s, i) => i));
    while (list.every((v, i) => v === i)) list = shuffle(list);
    let errors = 0;
    const ol = h("ol", { class: "order" });
    const fb = h("div");
    function draw(marks) {
      ol.replaceChildren(...list.map((idx, pos) => h("li", { class: marks ? (idx === pos ? "good" : "bad") : "" },
        h("span", { class: "mono" }, pos + 1),
        h("span", { class: "lbl" }, STEPS[idx].t, marks && idx === pos ? h("small", { html: STEPS[idx].d }) : null),
        h("button", { "aria-label": "Monter", onclick: () => move(pos, -1) }, "▲"),
        h("button", { "aria-label": "Descendre", onclick: () => move(pos, 1) }, "▼"))));
    }
    function move(pos, d) {
      const n = pos + d; if (n < 0 || n >= list.length) return;
      [list[pos], list[n]] = [list[n], list[pos]]; fb.replaceChildren(); draw();
    }
    const check = h("button", { class: "btn", onclick: () => {
      const right = list.filter((v, i) => v === i).length;
      draw(true);
      if (right === STEPS.length) {
        fb.replaceChildren(h("div", { class: "fb ok", html: "✅ Parfait ! Remarque : dès le <b>ServerHello</b>, le secret partagé existe — c'est pour ça que le certificat arrive déjà chiffré en TLS 1.3." }),
          h("button", { class: "btn", onclick: () => done(errors) }, "Terminer"));
        check.disabled = true;
      } else {
        errors++;
        fb.replaceChildren(h("div", { class: "fb ko", html: `❌ ${right} / ${STEPS.length} à la bonne place. Indice : on s'accorde d'abord sur le secret (Hello), puis le serveur prouve qui il est, puis chacun confirme que rien n'a été modifié (Finished).` }));
      }
    } }, "Valider l'ordre");
    box.append(ol, check, fb);
    draw();
  }
});

/* Niveau 5 — boss : l'homme du milieu */
LEVELS.push({
  title: "Boss : l'homme du milieu",
  intro: `<div class="story">📖 <b>Mallory</b> contrôle le Wi-Fi du café. Quand Alice se connecte à <code>banque.fr</code>, elle s'interpose : elle fait <b>un Diffie-Hellman avec Alice</b> et <b>un autre avec la banque</b>, et relaie (en lisant tout) les messages. Le chiffrement seul ne l'arrête pas… Que fait vraiment la vérification du certificat ? Lance la simulation <b>dans les deux modes</b>.</div>`,
  render(box, done) {
    const seen = { on: false, off: false };
    let errors = 0;
    const log = h("div", { class: "log" }, h("p", { class: "sub" }, "Lance une simulation."));
    const verdict = h("div");
    const qbox = h("div");
    const sim = on => {
      const lines = [
        "👩 Alice → (Wi-Fi de Mallory) : ClientHello pour <code>banque.fr</code>",
        "🦹 Mallory intercepte, ouvre sa propre connexion vers la vraie banque, et répond à Alice avec <b>sa</b> moitié de Diffie-Hellman.",
        "🦹 Mallory envoie à Alice un certificat. Elle n'a pas la clé privée de la banque, donc c'est <b>le sien</b>, pour <code>banque.fr</code>, signé par… elle-même."
      ];
      if (on) {
        lines.push("👩 Alice (navigateur) vérifie la chaîne : la signature ne remonte à <b>aucune CA de confiance</b>.",
          "🛑 <b>Connexion refusée</b> : « Votre connexion n'est pas privée ». <span class='tag ok'>Attaque bloquée</span>");
      } else {
        lines.push("👩 Alice (navigateur sans vérification) accepte n'importe quel certificat.",
          "🔓 Alice chiffre vers Mallory, qui déchiffre, lit le mot de passe, rechiffre vers la banque. <span class='tag ko'>Tout est compromis, et le cadenas s'affiche quand même.</span>");
      }
      log.replaceChildren(...lines.map(l => h("p", { html: l })));
      seen[on ? "on" : "off"] = true;
      verdict.replaceChildren();
      if (seen.on && seen.off && !qbox.childNodes.length) {
        qbox.append(h("hr"), h("p", { html: "<b>Dernière question.</b>" }));
        const qq = h("div"); qbox.append(qq);
        quiz(qq, [{ q: "Si le chiffrement est déjà là (Diffie-Hellman), pourquoi a-t-on <i>aussi</i> besoin des certificats ?",
          opts: ["Parce que Diffie-Hellman donne un secret, mais ne dit pas <b>avec qui</b> on le partage : il faut <b>authentifier</b> le serveur",
                 "Parce que Diffie-Hellman est trop lent", "Parce que Diffie-Hellman n'est pas chiffré"], good: 0,
          hints: { 1: "Ce n'est pas la raison.", 2: "Le problème n'est pas le chiffrement, mais l'identité de l'interlocuteur." },
          why: "<b>Chiffrement sans authentification = on parle en secret… peut-être avec l'attaquant.</b> TLS combine : échange de clés (confidentialité) + certificat/signature (authenticité) + condensés Finished (intégrité)." }],
          e => done(errors + e));
      }
    };
    box.append(
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => sim(false) }, "▶ Navigateur SANS vérification du certificat"),
        h("button", { class: "btn ghost", onclick: () => sim(true) }, "▶ Navigateur AVEC vérification")),
      h("p", {}), log, verdict, qbox);
  }
});

/* ---------- application ---------- */
const FICHE = `<h2>🏆 Bravo, tu as tout compris du cadenas</h2>
<ul class="fiche">
<li><b>Asymétrique</b> : on chiffre avec la clé <i>publique</i> du destinataire, on signe avec sa clé <i>privée</i>.</li>
<li><b>Diffie-Hellman éphémère</b> : un secret partagé fabriqué en public, jeté après la session (<i>forward secrecy</i>).</li>
<li><b>Certificat + CA</b> : lie une clé publique à un nom ; le navigateur contrôle nom, dates, chaîne de confiance, révocation.</li>
<li><b>Handshake</b> : Hello (clés) → Certificate + Verify (identité) → Finished (intégrité) → données en <b>symétrique</b>.</li>
<li><b>Sans authentification, le chiffrement ne protège pas de l'homme du milieu.</b></li>
</ul>
<p class="sub">Prochains concepts à venir : voir <code>ROADMAP.md</code>.</p>`;

let state = store.load() || { unlocked: 0, stars: [] };
let cur = Math.min(state.unlocked, LEVELS.length - 1);

function starsFor(errors) { return errors === 0 ? 3 : errors <= 3 ? 2 : 1; }

function renderNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren(...LEVELS.map((l, i) => h("button", { class: i === cur ? "cur" : "", disabled: i > state.unlocked, onclick: () => { cur = i; render(); } },
    `${i + 1}. ${l.title}`, h("span", { class: "stars" }, state.stars[i] ? "★".repeat(state.stars[i]) + "☆".repeat(3 - state.stars[i]) : (i > state.unlocked ? "🔒" : "à jouer")))));
}

function render() {
  renderNav();
  const stage = document.getElementById("stage");
  const lvl = LEVELS[cur];
  const body = h("div");
  const card = h("div", { class: "card" }, h("h2", {}, `Niveau ${cur + 1} · ${lvl.title}`), h("div", { html: lvl.intro }), body);
  stage.replaceChildren(card);
  lvl.render(body, errors => {
    const s = starsFor(errors);
    state.stars[cur] = Math.max(state.stars[cur] || 0, s);
    state.unlocked = Math.max(state.unlocked, Math.min(cur + 1, LEVELS.length));
    store.save(state);
    renderNav();
    const last = cur === LEVELS.length - 1;
    body.replaceChildren(h("div", { class: "fb ok", html: `🎉 Niveau terminé : <b>${"★".repeat(s)}${"☆".repeat(3 - s)}</b> (${errors} erreur${errors > 1 ? "s" : ""})` }),
      last ? h("div", { class: "card", html: FICHE }) : h("button", { class: "btn", onclick: () => { cur++; render(); } }, "Niveau suivant →"),
      h("p", {}, h("button", { class: "btn ghost", onclick: render }, "Rejouer ce niveau")));
  });
}

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Effacer ta progression ?")) { store.clear(); state = { unlocked: 0, stars: [] }; cur = 0; render(); }
});
render();
</script>
</body>
