<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port-443 Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="engine.css">
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="headtitle">PORT-443 QUEST</h1><button class="back" id="back" hidden>← tous les jeux</button></div>
    <span id="headsub"></span>
  </header>
  <div class="hub" id="hub">
    <p class="lead">Port-443 est une cité marchande où chaque message voyage à pied. Sept aventures, un concept de cybersécurité par jeu, avec une vraie histoire, des schémas et un bilan final.</p>
    <div class="cards" id="cards"></div>
  </div>
  <div id="game" hidden style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div id="log" role="log" aria-live="polite"></div>
    <div class="bar" id="bar"></div>
    <form id="form" autocomplete="off">
      <label for="cmd">&gt;</label>
      <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="tape une commande, ou clique sur celles en orange">
    </form>
  </div>
</div>
<script src="engine.js"></script>
<script src="games/tls.js"></script>
<script src="games/rsa.js"></script>
<script src="games/web.js"></script>
<script src="games/oauth.js"></script>
<script src="games/kerberos.js"></script>
<script src="games/hash.js"></script>
<script src="games/cors.js"></script>
<script>showHub();</script>
</body>
</html>
